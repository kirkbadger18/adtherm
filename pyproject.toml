[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "adtherm"
version = "0.0.1"
description = "Geometry generation for training adsorbate thermochemistry surrogate models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "scipy",
    "ase",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["adtherm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
